name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 4. EC2에 JAR 전송
      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "~/"
          strip_components: 2

      # 5. EC2에서 앱 재시작
      - name: Restart app on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            kill $(lsof -t -i:8080) || true
            sleep 3
            nohup java -jar ~/build/libs/stock-website-0.0.1-SNAPSHOT.jar \
              --spring.datasource.url="jdbc:mysql://localhost:3306/stocksite?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true" \
              --spring.datasource.username=stockuser \
              --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
              --alphavantage.api.key=OTGE4II4D30B0DYF \
              > ~/app.log 2>&1 &