<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>관심종목 - 주식 투자 관리</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; }
        .container { width: 80%; margin: 40px auto; background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-left: 5px solid #ff4081; padding-left: 15px; margin-bottom: 24px; }
        h3 { color: #555; font-size: 1em; margin: 28px 0 8px; padding-left: 8px; border-left: 3px solid #aaa; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border-bottom: 1px solid #eee; padding: 13px 15px; text-align: left; }
        th { background-color: #f4f4f4; color: #666; font-size: 0.88em; }
        .ticker { font-weight: bold; color: #1a1a2e; }
        .up { color: #e53935; font-weight: 600; }
        .down { color: #1e88e5; font-weight: 600; }
        .btn-group { margin-top: 30px; display: flex; gap: 10px; }
        button { padding: 10px 20px; background-color: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #555; }
        .remove-btn { padding: 5px 10px; background-color: #999; color: white; border: none; border-radius: 3px; font-size: 0.85em; cursor: pointer; }
        .remove-btn:hover { background-color: #777; }
        .empty { text-align: center; color: #888; padding: 24px; }
    </style>
</head>
<body>
<div class="container">
    <h2>💖 내 관심종목</h2>

    <!-- ETF 관심종목 -->
    <h3>📦 ETF</h3>
    <table>
        <thead>
        <tr>
            <th>Ticker</th>
            <th>ETF명</th>
            <th>현재가 (USD)</th>
            <th>전일비</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="etf : ${etfFavorites}">
            <td class="ticker" th:text="${etf.ticker}"></td>
            <td th:text="${etf.name}"></td>
            <td th:text="${etf.currentPrice != null ? '$' + etf.currentPrice : '-'}"></td>
            <td th:if="${etf.currentPrice != null}"
                th:class="${etf.getChange() > 0 ? 'up' : (etf.getChange() < 0 ? 'down' : '')}"
                th:text="${etf.getChangeFormatted() + ' (' + etf.getChangeRateFormatted() + ')'}">
            </td>
            <td th:if="${etf.currentPrice == null}" style="color:#bbb;">-</td>
            <td>
                <form th:action="@{'/etf/favorite/' + ${etf.id}}" method="post" style="margin:0;">
                    <button type="submit" class="remove-btn">✖ 해제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(etfFavorites)}">
            <td colspan="5" class="empty">
                등록된 ETF 관심종목이 없어요.<br>
                ETF 목록에서 관심종목을 추가해보세요!
            </td>
        </tr>
        </tbody>
    </table>

    <div class="btn-group">
        <button type="button" onclick="location.href='/etf'">📦 ETF 목록</button>
        <button type="button" onclick="location.href='/'">← 메인화면</button>
    </div>
</div>

<script th:inline="javascript">
    var message = /*[[${message}]]*/ null;
    var errorMessage = /*[[${errorMessage}]]*/ null;
    if (message) alert(message);
    if (errorMessage) alert(errorMessage);
</script>
</body>
</html>
