<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${etf.ticker} + ' - ETF 상세'">ETF 상세</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .container {
            width: 90%; max-width: 900px; margin: 40px auto;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px;
        }
        .etf-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .ticker-badge {
            background: #1a1a2e; color: white;
            padding: 10px 18px; border-radius: 8px;
            font-size: 1.4em; font-weight: 700;
        }
        .etf-info h2 { margin: 0 0 4px; font-size: 1.3em; color: #1a1a2e; }
        .etf-info p  { margin: 0; font-size: 0.88em; color: #888; }
        .price-row { display: flex; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
        .price-card {
            background: #f8f9fa; border-radius: 10px;
            padding: 14px 20px; min-width: 130px;
        }
        .price-card .label { font-size: 0.78em; color: #999; margin-bottom: 4px; }
        .price-card .value { font-size: 1.3em; font-weight: 700; color: #1a1a2e; }
        .up { color: #e53935 !important; }
        .down { color: #1e88e5 !important; }

        h3 { color: #1a1a2e; border-left: 4px solid #1a1a2e; padding-left: 12px; margin-bottom: 16px; }
        .news-list { list-style: none; padding: 0; margin: 0; }
        .news-item {
            padding: 16px 0; border-bottom: 1px solid #f0f0f0;
            display: flex; flex-direction: column; gap: 5px;
        }
        .news-item:last-child { border-bottom: none; }
        .news-title a {
            font-size: 0.97em; font-weight: 600; color: #1a1a2e;
            text-decoration: none;
        }
        .news-title a:hover { color: #4a90d9; text-decoration: underline; }
        .news-meta { font-size: 0.78em; color: #aaa; }
        .news-meta span { margin-right: 12px; }
        .no-news { text-align: center; color: #bbb; padding: 40px 0; font-size: 0.95em; }

        .btn-row { margin-top: 24px; display: flex; gap: 10px; }
        .btn { padding: 9px 18px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.88em; font-weight: 600; }
        .btn-back { background: #f0f2f5; color: #444; }
        .loading { text-align: center; color: #aaa; padding: 30px; }
    </style>
</head>
<body>
<div class="container">

    <!-- ETF 헤더 -->
    <div class="etf-header">
        <div class="ticker-badge" th:text="${etf.ticker}">SPY</div>
        <div class="etf-info">
            <h2 th:text="${etf.name}">ETF명</h2>
            <p th:text="${etf.description}">설명</p>
        </div>
    </div>

    <!-- 가격 정보 -->
    <div class="price-row">
        <div class="price-card">
            <div class="label">현재가</div>
            <div class="value"
                 th:text="${etf.currentPrice != null ? '$' + etf.currentPrice : '-'}">-</div>
        </div>
        <div class="price-card">
            <div class="label">전일 종가</div>
            <div class="value"
                 th:text="${etf.prePrice != null ? '$' + etf.prePrice : '-'}">-</div>
        </div>
        <div class="price-card">
            <div class="label">전일비</div>
            <div class="value"
                 th:class="${etf.getChange() > 0 ? 'value up' : (etf.getChange() < 0 ? 'value down' : 'value')}"
                 th:text="${etf.currentPrice != null ? (etf.getChange() > 0 ? '+' : '') + etf.getChange() : '-'}">-</div>
        </div>
        <div class="price-card">
            <div class="label">등락률</div>
            <div class="value"
                 th:class="${etf.getChangeRate() > 0 ? 'value up' : (etf.getChangeRate() < 0 ? 'value down' : 'value')}"
                 th:text="${etf.currentPrice != null ? (etf.getChangeRate() > 0 ? '+' : '') + etf.getChangeRate() + '%' : '-'}">-</div>
        </div>
    </div>

    <!-- 관련 일본어 기사 -->
    <h3>📰 관련 기사 (日本語)</h3>

    <div th:if="${#lists.isEmpty(newsList)}" class="no-news">
        관련 기사를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.
    </div>

    <ul class="news-list" th:if="${!#lists.isEmpty(newsList)}">
        <li class="news-item" th:each="article : ${newsList}">
            <div class="news-title">
                <a th:href="${article.url}" th:text="${article.title}" target="_blank">제목</a>
            </div>
            <div class="news-meta">
                <span th:text="${article.source}">출처</span>
                <span th:text="${article.date}">날짜</span>
            </div>
        </li>
    </ul>

    <div class="btn-row">
        <button class="btn btn-back" onclick="location.href='/etf'">← ETF 목록</button>
    </div>
</div>
</body>
</html>
