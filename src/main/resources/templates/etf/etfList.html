<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>ETF 종목 - 주식 투자 관리</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .container {
            width: 90%; max-width: 1000px; margin: 40px auto;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px;
        }
        h2 { color: #1a1a2e; font-size: 1.5em; margin-bottom: 6px; }
        .meta { font-size: 0.82em; color: #aaa; margin-bottom: 20px; }
        .meta span { color: #555; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #f8f9fa; color: #666; font-size: 0.82em; text-transform: uppercase; }
        tr:hover { background: #fafbff; cursor: pointer; }
        .ticker { font-weight: 700; color: #1a1a2e; }
        .desc { font-size: 0.82em; color: #888; margin-top: 3px; }
        .price { font-weight: 600; }
        .up { color: #e53935; font-weight: 600; }
        .down { color: #1e88e5; font-weight: 600; }
        .tag {
            display: inline-block; padding: 3px 9px;
            background: #e8f0fe; color: #1a73e8;
            border-radius: 20px; font-size: 0.75em; font-weight: 600;
        }
        .btn-row { margin-top: 24px; display: flex; gap: 10px; }
        .btn { padding: 9px 18px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.88em; font-weight: 600; }
        .btn-back { background: #f0f2f5; color: #444; }
    </style>
</head>
<body>
<div class="container">
    <h2>📦 ETF 종목 현황</h2>
    <div class="meta">
        마지막 업데이트: <span th:text="${lastUpdated}">-</span>
        &nbsp;|&nbsp; 클릭하면 관련 일본어 기사를 볼 수 있어요
    </div>

    <table>
        <thead>
        <tr>
            <th>Ticker</th>
            <th>ETF명 / 설명</th>
            <th>현재가 (USD)</th>
            <th>전일비</th>
            <th>등락률</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="etf : ${etfs}" th:onclick="|location.href='/etf/${etf.id}'|">
            <td><span class="ticker" th:text="${etf.ticker}"></span></td>
            <td>
                <div th:text="${etf.name}"></div>
                <div class="desc" th:text="${etf.description}"></div>
            </td>
            <td class="price">
                <span th:if="${etf.currentPrice != null}"
                      th:text="'$' + ${etf.currentPrice}"></span>
                <span th:if="${etf.currentPrice == null}" style="color:#bbb;">-</span>
            </td>
            <td th:if="${etf.currentPrice != null}"
                th:class="${etf.getChange() > 0 ? 'up' : (etf.getChange() < 0 ? 'down' : '')}">
                <span th:text="${(etf.getChange() > 0 ? '+' : '') + etf.getChange()}"></span>
            </td>
            <td th:if="${etf.currentPrice == null}" style="color:#bbb;">-</td>
            <td th:if="${etf.currentPrice != null}"
                th:class="${etf.getChangeRate() > 0 ? 'up' : (etf.getChangeRate() < 0 ? 'down' : '')}">
                <span th:text="${(etf.getChangeRate() > 0 ? '+' : '') + etf.getChangeRate() + '%'}"></span>
            </td>
            <td th:if="${etf.currentPrice == null}" style="color:#bbb;">-</td>
        </tr>
        </tbody>
    </table>

    <div class="btn-row">
        <button class="btn btn-back" onclick="location.href='/'">← 메인화면</button>
        <button class="btn btn-back" onclick="location.href='/stocks'">📊 주식 목록</button>
    </div>
</div>
</body>
</html>
